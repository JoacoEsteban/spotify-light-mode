name: Refresh Spotify CSS

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-spotify-css
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh generated CSS assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure latest Spotify light CSS
        run: bun run ensure:spotify-light-css

      - name: Check for generated changes
        id: changes
        run: |
          before_fingerprint="$(git show HEAD:assets/spotify-light/css-manifest.json | jq -r '.output.fingerprint')"
          after_fingerprint="$(jq -r '.output.fingerprint' assets/spotify-light/css-manifest.json)"

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$before_fingerprint" != "$after_fingerprint" ]; then
            echo "output_fingerprint_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "output_fingerprint_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package version
        if: steps.changes.outputs.changed == 'true' && steps.changes.outputs.output_fingerprint_changed == 'true'
        run: npm version minor --no-git-tag-version

      - name: Commit and push refresh
        if: steps.changes.outputs.changed == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if [ "${{ steps.changes.outputs.output_fingerprint_changed }}" = "true" ]; then
            git commit -m "refresh Spotify CSS assets for v$version"
            git tag "v$version"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push origin "v$version"
          else
            git commit -m "refresh Spotify CSS assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Trigger publish workflow
        if: steps.changes.outputs.changed == 'true' && steps.changes.outputs.output_fingerprint_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh workflow run publish.yml --ref "v$version"
